services:
  # ---------------------------------------------------------------------------
  # Django REST API (the only service hosted on Render).
  #
  # The React (Vite) frontend is deployed separately on Vercel at
  # https://www.yieldary.us and builds with VITE_API_BASE_URL set to the
  # service URL below (see frontend/.env.production).
  # ---------------------------------------------------------------------------
  - type: web
    name: yeildary
    runtime: python
    plan: free
    rootDir: backend
    # `migrate` runs on every deploy so a fresh or reset database is usable.
    # Without it every data-backed API call fails with an opaque 500.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    # Verifies the database too, not just that the process is up.
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Django hostname(s). `.onrender.com` also covers the generated service URL.
      - key: DJANGO_ALLOWED_HOSTS
        value: yeildary.onrender.com,.onrender.com
      # React frontend origin (Vercel). Used for CORS_ALLOWED_ORIGINS and
      # CSRF_TRUSTED_ORIGINS; the apex and www variants are also trusted by
      # default in backend/config/settings.py.
      - key: FRONTEND_URL
        value: https://www.yieldary.us
      - key: DATABASE_URL
        fromDatabase:
          name: yeildary-db
          property: connectionString
      # Credentials are set in the Render dashboard, never committed.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Yieldary AI <yieldaryai@gmail.com>
      - key: GEMINI_API_KEY
        sync: false
      # Never echo verification codes back to the browser in production.
      - key: PHONE_VERIFICATION_DEV_MODE
        value: "0"

databases:
  - name: yeildary-db
    plan: free
    databaseName: yieldary
    user: yieldary
