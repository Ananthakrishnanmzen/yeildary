services:
  - type: web
    name: yieldary-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: yieldary-db
          property: connectionString

databases:
  - name: yieldary-db
    plan: free
    databaseName: yieldary
    user: yieldary
