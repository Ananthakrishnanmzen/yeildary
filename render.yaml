services:
  # ---------------------------------------------------------------------------
  # Django REST API
  # ---------------------------------------------------------------------------
  - type: web
    name: yieldary-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Django hostname(s). `.onrender.com` also covers the generated service URL.
      - key: DJANGO_ALLOWED_HOSTS
        value: yieldary-backend.onrender.com,.onrender.com
      # React frontend origin. Used for CORS_ALLOWED_ORIGINS and CSRF_TRUSTED_ORIGINS.
      # Update this if the deployed frontend URL differs.
      - key: FRONTEND_URL
        value: https://yieldary-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: yieldary-db
          property: connectionString
      # Carried over from backend/.env; set these in the Render dashboard.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Yieldary AI <yieldaryai@gmail.com>
      - key: GEMINI_API_KEY
        sync: false
      # Never echo verification codes back to the browser in production.
      - key: PHONE_VERIFICATION_DEV_MODE
        value: "0"

  # ---------------------------------------------------------------------------
  # React (Vite) static site
  # ---------------------------------------------------------------------------
  - type: web
    name: yieldary-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Public API base URL (includes the /api prefix). Overrides .env.production.
      - key: VITE_API_BASE_URL
        value: https://yieldary-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

databases:
  - name: yieldary-db
    plan: free
    databaseName: yieldary
    user: yieldary
