{% extends 'Farmer/base_auth.html' %}

{% block title %}Researcher access · Yieldary AI{% endblock %}

{% block content %}

  <p class="font-data text-[10px] uppercase tracking-[0.24em] text-sky">Reserved</p>
  <h1 class="mt-2 font-display text-3xl font-semibold tracking-tight text-white">Researcher access is coming soon</h1>
  <p class="mt-3 text-sm leading-6 text-slate-400">
