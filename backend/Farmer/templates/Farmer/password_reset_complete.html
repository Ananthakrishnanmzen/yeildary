{% extends 'Farmer/base_auth.html' %}

{% block title %}Password updated · Yieldary AI{% endblock %}

{% block content %}
<div class="glass rounded-3xl border border-white/10 p-6 text-center shadow-2xl shadow-black/40 sm:p-8">
  <span class="mx-auto grid h-12 w-12 place-items-center rounded-2xl border border-lime/30 bg-lime/10 text-lime">
    <svg viewBox="0 0 24 24" fill="none" class="h-6 w-6" aria-hidden="true">
      <path d="m5 12.5 4 4L19 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
  <h1 class="mt-5 font-display text-2xl font-semibold text-white">Password updated</h1>
  <p class="mt-3 text-sm leading-6 text-slate-400">
    Your password has been changed. You can now sign in with your new password.
  </p>
  <a href="{% url 'farmer:login' %}" class="mt-6 inline-flex rounded-xl border border-lime/50 bg-lime/15 px-4 py-2.5 text-xs font-semibold text-lime transition hover:bg-lime/25">
    Sign in
  </a>
</div>
{% endblock %}
